name: update-arome

# AROME France HD 1,3 km (Météo-France) recortado a Aragón para la capa del mapa.
#
# Va aparte de update-data para que su descarga (~16 MB por hora de previsión)
# o sus fallos no afecten nunca a las estaciones. Mismo esquema: un bucle de
# ~5,5 h que cada 10 min mira si hay una pasada nueva completa, la procesa por
# partes y, cuando tiene las 52 horas, la publica en la rama «arome» (un único
# commit, push forzado). Al terminar se relanza a sí mismo; el cron queda como
# red de seguridad.

on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: update-arome
  cancel-in-progress: false

jobs:
  arome:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LOOP_MINUTES: 330
      EVERY: 600
      BUDGET: 480          # segundos de proceso por vuelta
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements-arome.txt

      - run: pip install -r scraper/requirements-arome.txt

      - name: Pasada de AROME ya publicada
        run: |
          mkdir -p out
          if git fetch --depth=1 origin arome 2>/dev/null; then
            git show FETCH_HEAD:manifest.json 2>/dev/null \
              | python -c "import json,sys; print(json.load(sys.stdin).get('id', ''))" > out/arome_run.txt || true
          fi
          echo "publicada: $(cat out/arome_run.txt 2>/dev/null || echo ninguna)"

      - name: Bucle de proceso y publicación
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "aragonwx-bot"
          git config --global user.email "actions@users.noreply.github.com"
          publish_arome() {
            rm -rf pubar && cp -r out/arome_pub pubar
            run=$(python -c "import json; print(json.load(open('out/arome_pub/manifest.json'))['run'])")
            (
              cd pubar
              git init -q
              git checkout -q -b arome
              git add .
              git commit -q -m "arome: pasada ${run} [bot]"
              git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" arome
            ) && python -c "import json; print(json.load(open('out/arome_pub/manifest.json'))['id'])" > out/arome_run.txt \
              && echo "publicada la pasada ${run}"
          }
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while :; do
            start=$(date +%s)
            echo "::group::$(date -u +%FT%TZ)"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || echo "::warning::no se pudo actualizar el código"
            git log -1 --format='código: %h %s'
            (cd scraper && python -m aragonwx.arome --stage ../out/arome_stage --publish ../out/arome_pub \
                --published-run "$(cat ../out/arome_run.txt 2>/dev/null)" --budget "${BUDGET}") \
              || echo "::warning::AROME ha fallado"
            [ -f out/arome_ready ] && { publish_arome && rm -f out/arome_ready || echo "::warning::no se pudo publicar AROME"; }
            echo "::endgroup::"
            now=$(date +%s)
            [ $(( now + EVERY )) -lt $end ] || break
            sleep $(( EVERY - (now - start) > 0 ? EVERY - (now - start) : 1 ))
          done

      - name: Relanzar la cadena
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run arome.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}"
